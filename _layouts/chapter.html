<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<nav class="chapters">
  <button class="toggle" aria-label="Toggle chapters" aria-expanded="true"></button>
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <ol>
  {% assign chapters = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
  {% for c in chapters %}
    <li{% if c.url == page.url %} class="current"{% endif %}><a href="{{ c.url | relative_url }}">{{ c.title }}</a></li>
  {% endfor %}
  </ol>
</nav>

<main>
  <h1>{{ page.title }}</h1>
  {{ content }}
</main>

<aside class="on-this-page"><button class="toggle" aria-label="Toggle contents" aria-expanded="true"></button><b>Contents</b><ul></ul></aside>

<script>
// right sidebar: built from the rendered headings, kramdown already gave them ids
const asideEl = document.querySelector('.on-this-page');
const list = asideEl.querySelector('ul');
const headings = [...document.querySelectorAll('main h2, main h3')];
for (const h of headings) {
  const li = document.createElement('li');
  li.className = h.tagName;
  li.innerHTML = '<a href="#' + h.id + '"></a>';
  li.firstChild.textContent = h.textContent;
  list.append(li);
}
if (!headings.length) asideEl.hidden = true;

// scroll-spy: the current section is the last heading scrolled past the top 30% of the viewport,
// so its link stays lit while reading the body below it
const links = headings.map(h => list.querySelector('a[href="#' + h.id + '"]'));
function spy() {
  const current = headings.findLastIndex(h => h.getBoundingClientRect().top < innerHeight * 0.3);
  links.forEach((a, i) => a.classList.toggle('active', i === current));
}
addEventListener('scroll', spy, { passive: true });
spy();

// both sidebars fold to a thin strip, so images and diagrams get the room;
// localStorage keeps them folded across reloads and chapters
for (const b of document.querySelectorAll('.toggle')) {
  const side = b.parentElement, key = 'gotion-closed-' + side.classList[0];
  const fold = closed => {
    b.setAttribute('aria-expanded', !side.classList.toggle('closed', closed));
    try { localStorage[key] = closed ? '1' : ''; } catch {}
  };
  try { fold(localStorage[key] === '1'); } catch {}
  b.onclick = () => fold(!side.classList.contains('closed'));
}
</script>

<script type="module">
import { highlightGherkin } from "{{ '/assets/gherkin.mjs' | relative_url }}";

const terms = [...document.querySelectorAll('main table')]
  .filter(table => table.querySelector('th')?.textContent.trim() === 'Term')
  .flatMap(table => [...table.querySelectorAll('tbody tr')]
    .map(row => row.cells[0].textContent.trim()));

for (const code of document.querySelectorAll('.language-gherkin code, code.language-gherkin')) {
  code.parentElement.tabIndex = 0;
  code.parentElement.setAttribute('aria-label', code.textContent.split('\n')[0]);
  code.innerHTML = highlightGherkin(code.textContent, terms);
}
</script>

<script type="module">
// ```mermaid fences come out of kramdown as plain code blocks, wrapped in a div when rouge
// highlights them (GitHub Pages) and bare otherwise: hand their source to Mermaid
const diagrams = document.querySelectorAll('div.language-mermaid, pre:has(> code.language-mermaid)');
if (diagrams.length) {
  const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
  mermaid.initialize({ startOnLoad: false });
  // one at a time: class diagrams with namespaces rendered in one batch overlap each other
  for (const [i, d] of diagrams.entries()) {
    const figure = document.createElement('figure');
    figure.className = 'diagram';
    figure.innerHTML = (await mermaid.render('diagram-' + i, d.textContent)).svg;
    d.replaceWith(figure);
  }
}
</script>

</body>
</html>
