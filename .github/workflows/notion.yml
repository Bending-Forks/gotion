name: Notion

# Keeps the Pull Requests database on Notion in step with GitHub, related to the Tasks Tracker through the Notion links in
# the description of each pull request, and moves to Done the tasks a merged pull request completes. The logic is in
# .github/scripts/notion.mjs.
# Separate from the CI: it checks nothing, and a Notion outage must not turn `success` red.
on:
  pull_request:
    types: [opened, edited, reopened, closed, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# One run at a time per pull request: each writes the whole page from its event, so a newer event can replace a waiting one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

jobs:
  pull-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - run: node .github/scripts/notion.mjs
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
