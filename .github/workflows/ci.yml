name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older runs; pushes to main get their own group and are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # main only takes a fast-forward of a branch already tested in its PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: node --test "tests/*.test.mjs"

  go:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The go directive of go.work is the oldest Go we support
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # ./... does not reach into the modules of a workspace from its root, so list them
      - run: |
          modules=$(go list -m -f '{{.Dir}}/...')
          go vet $modules
          go build $modules
          go test $modules
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      # .golangci.yml: the standard linters, and the depguard rule that is the fitness function of ADR-07
      - run: golangci-lint run $(go list -m -f '{{.Dir}}/...')
      # The rule must fail on each of its violations in tests/fixtures/fitness/, a module outside go.work
      - working-directory: tests/fixtures/fitness
        env:
          GOWORK: "off"
        run: |
          # The Go problem matcher of setup-go would annotate the expected violations as errors; this is the last step of the job
          echo "::remove-matcher owner=go::"
          # mod: the fixtures have no go.sum, so Go resolves the dependencies the chassis will have
          if out=$(golangci-lint run --config ../../../.golangci.yml --modules-download-mode=mod ./... 2>&1); then
            echo "$out"
            echo "::error::golangci-lint passes on the violations in tests/fixtures/fitness/"
            exit 1
          fi
          for file in $(find services -name '*.go'); do
            grep -q "$file:.*(depguard)" <<< "$out" || { echo "$out"; echo "::error::depguard does not fail on $file"; exit 1; }
          done
          echo "$out"

  node:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The integration tests of Editing create and drop their own databases on editing-db, the server of compose.yaml they use in development
    env:
      TEST_DATABASE_URL: postgres://editing:editing@localhost:5435/editing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker compose up -d --wait --quiet-pull editing-db
      - run: npm ci
      - run: npm run build -w services/editing -w packages/crdt -w client/web
      - run: npm test -w services/editing -w packages/crdt -w client/web
      - run: npm run check:bundle -w client/web

  compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The command of the README; kafka-topics starts once Kafka is healthy
      - run: docker compose up -d --quiet-pull
      # Exits with the code of the topic creation
      - run: docker compose wait kafka-topics
      # Every other container must become healthy; kafka-topics is left out, since up would start it again and --wait only waits for it to run
      - run: docker compose up -d --wait $(docker compose config --services | grep -vx kafka-topics)
      - if: failure()
        run: docker compose logs

  kubernetes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # An empty single-node cluster
      - uses: helm/kind-action@v1.15.2
      # The commands of the README
      - run: deploy/kubernetes/secrets.sh && kubectl apply -k deploy/kubernetes
      # A second run must keep the passwords the servers already took
      - run: |
          before=$(kubectl get secret account-db --namespace gotion -o jsonpath='{.data.POSTGRES_PASSWORD}')
          deploy/kubernetes/secrets.sh
          [ "$before" = "$(kubectl get secret account-db --namespace gotion -o jsonpath='{.data.POSTGRES_PASSWORD}')" ]
      - run: kubectl wait --namespace gotion --for=condition=Complete job/kafka-topics --timeout=300s
      - run: kubectl wait --namespace gotion --for=condition=Ready pods --selector=app.kubernetes.io/name --timeout=300s
      # The data must outlive the pod: write a message and a row with the credentials of the Secret, delete the pods, read both back from their replacements. One PostgreSQL stands for the five, which share their manifest.
      - run: |
          echo survived | kubectl exec --stdin kafka-0 --namespace gotion -- /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic account
          kubectl exec account-db-0 --namespace gotion -- sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "CREATE TABLE restart (n int); INSERT INTO restart VALUES (42)"'
          kubectl delete pod kafka-0 account-db-0 --namespace gotion
          kubectl rollout status statefulset/kafka --namespace gotion --timeout=300s
          kubectl rollout status statefulset/account-db --namespace gotion --timeout=300s
          message=$(kubectl exec kafka-0 --namespace gotion -- /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic account --from-beginning --max-messages 1 --timeout-ms 60000)
          [ "$message" = survived ]
          row=$(kubectl exec account-db-0 --namespace gotion -- sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT n FROM restart"')
          [ "$row" = 42 ]
      - if: failure()
        run: |
          kubectl get pods,pvc --namespace gotion
          for pod in $(kubectl get pods --namespace gotion -o name); do kubectl logs "$pod" --namespace gotion --all-containers --prefix; done

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - run: gem install jekyll
      - run: jekyll build --strict_front_matter --source docs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > msg && sh .husky/commit-msg msg || exit 1
          done

  success:
    needs: [test, go, node, compose, kubernetes, site, commits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')

  deploy:
    needs: success
    # Not just the push check: its implicit success() also looks at commits, which is skipped on push
    if: ${{ !cancelled() && github.event_name == 'push' && needs.success.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
