name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older runs; pushes to main get their own group and are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # main only takes a fast-forward of a branch already tested in its PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: node --test "tests/*.test.mjs"

  go:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The go directive of go.work is the oldest Go we support
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # ./... does not reach into the modules of a workspace from its root, so list them
      - run: |
          modules=$(go list -m -f '{{.Dir}}/...')
          go vet $modules
          go build $modules
          go test $modules

  node:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The integration tests of Editing create and drop their own databases on this PostgreSQL
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w services/editing -w packages/crdt -w client/web
      - run: npm test -w services/editing -w packages/crdt -w client/web
      - run: npm run check:bundle -w client/web

  compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The command of the README; kafka-topics starts once Kafka is healthy
      - run: docker compose up -d --quiet-pull
      # Exits with the code of the topic creation
      - run: docker compose wait kafka-topics
      # Every other container must become healthy: --wait on all of them would fail on the exited kafka-topics
      - run: docker compose up -d --wait $(docker compose config --services | grep -vx kafka-topics)
      - if: failure()
        run: docker compose logs

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - run: gem install jekyll
      - run: jekyll build --strict_front_matter --source docs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > msg && sh .husky/commit-msg msg || exit 1
          done

  success:
    needs: [test, go, node, compose, site, commits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')

  deploy:
    needs: success
    # Not just the push check: its implicit success() also looks at commits, which is skipped on push
    if: ${{ !cancelled() && github.event_name == 'push' && needs.success.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
