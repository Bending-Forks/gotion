version: "2"

linters:
  # The standard linters of golangci-lint, plus the fitness functions on imports
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # ADR-07 and the hexagon: domain/ and app/ import only the domain of their service and the standard library, minus the packages ADR-07 gives to the chassis, so neither the chassis, nor a library, nor the code an adapter generates. A denied package wins over $gostd, its allow entry being no longer. Go's internal/ rule already keeps a service from importing the domain of another. A new service with a hexagon adds its domain below. The name is what a violation prints, lowercased by golangci-lint.
        "adr-07: domain/ and app/ import no library":
          list-mode: strict
          files:
            - "**/internal/domain/**"
            - "**/internal/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/Bending-Forks/gotion/services/account/internal/domain
            - github.com/Bending-Forks/gotion/services/membership/internal/domain
            - github.com/Bending-Forks/gotion/services/discussion/internal/domain
            - github.com/Bending-Forks/gotion/services/notification/internal/domain
          deny:
            - pkg: net/http
              desc: "ADR-07: the HTTP server of the chassis, only in the adapters"
            - pkg: log/slog
              desc: "ADR-07: the logs of the chassis; domain/ and app/ return errors and events"
            - pkg: os
              desc: "ADR-07: the configuration of the chassis, read with os.Getenv"
