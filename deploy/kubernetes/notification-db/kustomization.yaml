apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../postgres
namePrefix: notification-
labels:
  - pairs:
      app.kubernetes.io/instance: notification-db
    includeSelectors: true
patches:
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: notification-db
