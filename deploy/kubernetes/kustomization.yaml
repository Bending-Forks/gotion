# The manifests of Gotion on a single-node cluster (kind or Minikube), all in the namespace gotion. The credentials of the
# databases are not here: secrets.sh creates them in the cluster. From the root of the repository:
#   deploy/kubernetes/secrets.sh && kubectl apply -k deploy/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gotion
resources:
  - namespace.yaml
  - kafka.yaml
  # One PostgreSQL server per service (ADR-06), each an instance of postgres/
  - account-db
  - membership-db
  - editing-db
  - discussion-db
  - notification-db
