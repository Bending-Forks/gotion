# Kafka as in compose.yaml: one node that is both broker and controller (KRaft), its log on a volume of its own. The services reach it at kafka:9092, the same address they use in Compose.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # Headless, the governing Service of the StatefulSet: kafka resolves to the pod once it is ready
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      securityContext:
        # The image runs as appuser (uid and gid 1000), which must be able to write the volume
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            # A misspelt topic fails instead of being created empty: the topics are the ones the Job kafka-topics creates
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            # The default heap is 1 GB, as much as the whole limit below
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m" }
          ports:
            - name: kafka
              containerPort: 9092
          # An open port, not a request through the Kafka tools as in Compose: each of those starts a JVM inside the memory limit. No liveness probe: a broker that fails exits, and the kubelet restarts it.
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
# Creates one topic per upstream context, named after it (Contracts), as kafka-topics does in compose.yaml. Notification publishes nothing, so it has no topic. --if-not-exists makes a second run harmless. Kubernetes refuses any change to the pod template of an existing Job, so the commands of the README delete this one before every apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: apache/kafka:4.4.0
          command: ["sh", "-ec"]
          args:
            - |
              # kafka resolves only once the broker is ready
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null; do sleep 5; done
              for topic in account membership editing discussion; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
              done
          # The Kafka tools take a heap of 256 MB at most
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: 500m, memory: 384Mi }
