openapi: 3.1.0
info:
  title: Account
  version: 1.0.0
  description: >-
    Users and workspaces (US-01, US-02). The queries under /internal/v1 answer the other services
    and are never forwarded to a client.
tags:
  - name: queries
    description: The queries answered to other services
paths:
  /internal/v1/users:
    get:
      tags: [queries]
      operationId: findUserByEmail
      summary: The UserId registered with an email address, for Membership
      parameters:
        - name: email
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: The user registered with the address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '404':
          description: No user is registered with the address
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/workspaces:
    get:
      tags: [queries]
      operationId: getWorkspaceNames
      summary: The names of a batch of workspaces, for the gateway
      description: A workspace that does not exist, or is deleted, is left out of the answer.
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The workspaces found
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
  /internal/v1/users/{userId}/main-workspace:
    get:
      tags: [queries]
      operationId: getMainWorkspace
      summary: The main workspace of a user, for the gateway
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The main workspace, absent when unset
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceId:
                    $ref: '#/components/schemas/Id'
        '404':
          description: No such user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  responses:
    BadRequest:
      description: The request does not match its schema
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
    Email:
      type: string
      format: email
      maxLength: 254
    RegisteredUser:
      type: object
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
    WorkspaceName:
      description: Never blank
      type: string
      minLength: 1
      maxLength: 100
      pattern: '\S'
    Workspace:
      type: object
      required: [workspaceId, name]
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/WorkspaceName'
    Problem:
      description: An error, as in RFC 9457
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
