openapi: 3.1.0
info:
  title: Account
  version: 1.0.0
  description: >-
    Users and workspaces (US-01, US-02). The client API under /v1 is forwarded by the API gateway,
    which sets X-User-Id from the sign-in token (ADR-09). The queries under /internal/v1 answer the
    other services and are never forwarded to a client.
tags:
  - name: client
    description: The client API, through the API gateway
  - name: queries
    description: The queries answered to other services
paths:
  /v1/users:
    post:
      tags: [client]
      operationId: register
      summary: Register
      description: Creates the user, then a policy creates their first workspace (US-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: The user is registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email address is already in use
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/sessions:
    post:
      tags: [client]
      operationId: signIn
      summary: Sign in
      description: >-
        Sets the sign-in token, a JWT signed with Ed25519, in an HttpOnly, SameSite=Strict cookie
        that lasts 8 h (ADR-09). More than 5 failed attempts per account in 15 minutes are throttled
        (QA-07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '204':
          description: Signed in
          headers:
            Set-Cookie:
              description: The sign-in token
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unknown email address or wrong password, not told apart
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many failed attempts for this account
          headers:
            Retry-After:
              description: Seconds to wait before the next attempt
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/workspaces:
    post:
      tags: [client]
      operationId: createWorkspace
      summary: Create workspace
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceNameBody'
      responses:
        '201':
          description: The workspace is created, with the user as its creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags: [client]
      operationId: renameWorkspace
      summary: Rename workspace
      description: Only an Admin of the workspace, as Membership answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceNameBody'
      responses:
        '204':
          description: Renamed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [client]
      operationId: deleteWorkspace
      summary: Delete workspace
      description: Only an Admin of the workspace, as Membership answers.
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/workspaces/{workspaceId}/open:
    parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [client]
      operationId: openWorkspace
      summary: Open workspace
      description: Saves the workspace as the main workspace of the user, who must be a member of it.
      responses:
        '204':
          description: The workspace is the main workspace of the user
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/users:
    get:
      tags: [queries]
      operationId: findUserByEmail
      summary: The UserId registered with an email address, for Membership
      parameters:
        - name: email
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: The user registered with the address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '404':
          description: No user is registered with the address
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/workspaces:
    get:
      tags: [queries]
      operationId: getWorkspaceNames
      summary: The names of a batch of workspaces, for the gateway
      description: A workspace that does not exist, or is deleted, is left out of the answer.
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The workspaces found
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
  /internal/v1/users/{userId}/main-workspace:
    get:
      tags: [queries]
      operationId: getMainWorkspace
      summary: The main workspace of a user, for the gateway
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The main workspace, absent when unset
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceId:
                    $ref: '#/components/schemas/Id'
        '404':
          description: No such user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: The signed-in user, set by the API gateway from the sign-in token
      schema:
        $ref: '#/components/schemas/Id'
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: The request does not match its schema
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAdmin:
      description: The user is a member of the workspace but not an Admin
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        The workspace does not exist or the user is not a member of it; the two are answered alike
        (QA-06)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Membership did not answer, so the command is refused (fail closed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
    Email:
      type: string
      format: email
      maxLength: 254
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 8
          maxLength: 128
    RegisteredUser:
      type: object
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
    WorkspaceName:
      description: Never blank
      type: string
      minLength: 1
      maxLength: 100
      pattern: '\S'
    WorkspaceNameBody:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/WorkspaceName'
    Workspace:
      type: object
      required: [workspaceId, name]
      properties:
        workspaceId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/WorkspaceName'
    Problem:
      description: An error, as in RFC 9457
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
