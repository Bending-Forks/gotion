# The infrastructure for development and for the integration tests: Kafka and one PostgreSQL server per service (ADR-06).
# `docker compose up -d` starts it and `docker compose wait kafka-topics` returns once the topics exist; `docker compose down` stops it and
# keeps the data, `docker compose down -v` deletes the data too.
# Every port is bound to 127.0.0.1, so nothing is reachable from outside this host. GOTION_PORT_PREFIX, from 1 to 5, goes in front of
# every host port, so that a second instance can run beside the first: with COMPOSE_PROJECT_NAME=gotion-x GOTION_PORT_PREFIX=1,
# 5433 becomes 15433 and 9094 becomes 19094.

# One name for every checkout and worktree, so they share one instance; COMPOSE_PROJECT_NAME overrides it
name: gotion

x-postgres: &postgres
  image: postgres:18-alpine
  healthcheck:
    # Over TCP like the clients: on the first start the entrypoint runs a temporary server on the Unix socket only, to create the database
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 2s
    retries: 15

services:
  # One node that is both broker and controller (KRaft). Other containers use kafka:9092, the host localhost:9094.
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${GOTION_PORT_PREFIX:-}9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A misspelt topic fails instead of being created empty: the topics are the ones kafka-topics creates
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - 127.0.0.1:${GOTION_PORT_PREFIX:-}9094:9094
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates one topic per upstream context, named after it (Contracts), then exits; a service that consumes waits for it with
  # condition: service_completed_successfully. Notification publishes nothing, so it has no topic.
  kafka-topics:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for topic in account membership editing discussion; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  # TODO: every user and password is the name of its service, which is safe only on a development machine. The Compose of the whole system must take the credentials from a secret, never from a file in the repository, as the Kubernetes manifests do (deploy/kubernetes/secrets.sh).
  account-db:
    <<: *postgres
    environment: { POSTGRES_USER: account, POSTGRES_PASSWORD: account, POSTGRES_DB: account }
    ports: ["127.0.0.1:${GOTION_PORT_PREFIX:-}5433:5432"]
    volumes: ["account-db:/var/lib/postgresql"]

  membership-db:
    <<: *postgres
    environment: { POSTGRES_USER: membership, POSTGRES_PASSWORD: membership, POSTGRES_DB: membership }
    ports: ["127.0.0.1:${GOTION_PORT_PREFIX:-}5434:5432"]
    volumes: ["membership-db:/var/lib/postgresql"]

  editing-db:
    <<: *postgres
    environment: { POSTGRES_USER: editing, POSTGRES_PASSWORD: editing, POSTGRES_DB: editing }
    ports: ["127.0.0.1:${GOTION_PORT_PREFIX:-}5435:5432"]
    volumes: ["editing-db:/var/lib/postgresql"]

  discussion-db:
    <<: *postgres
    environment: { POSTGRES_USER: discussion, POSTGRES_PASSWORD: discussion, POSTGRES_DB: discussion }
    ports: ["127.0.0.1:${GOTION_PORT_PREFIX:-}5436:5432"]
    volumes: ["discussion-db:/var/lib/postgresql"]

  notification-db:
    <<: *postgres
    environment: { POSTGRES_USER: notification, POSTGRES_PASSWORD: notification, POSTGRES_DB: notification }
    ports: ["127.0.0.1:${GOTION_PORT_PREFIX:-}5437:5432"]
    volumes: ["notification-db:/var/lib/postgresql"]

volumes:
  kafka:
  account-db:
  membership-db:
  editing-db:
  discussion-db:
  notification-db:
